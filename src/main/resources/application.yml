spring:
  application:
    name: puppy-kindergarten-api
  config:
    # 로컬 실행 시 프로젝트 루트의 .env 를 읽는다. 파일이 없으면 OS 환경변수만 사용한다.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:puppy_kindergarten}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
